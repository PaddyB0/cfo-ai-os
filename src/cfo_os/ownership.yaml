# Every path in template/CFO OS/ has one ownership class. Rules are tried in order and the
# first match wins; a template file no rule matches fails the tests. Patterns are
# fnmatch-style over the path relative to "CFO OS/", with "/" as the separator ("*" also
# matches "/").
#
#   system     written at deploy; on upgrade, template regions are replaced if unedited
#   context    written at deploy with placeholders filled; never touched on upgrade
#   generated  written by cfo-os; the catalogue is regenerated only with --catalogue
#   client     written at deploy with starter headers only; never opened on upgrade
#
# See docs/upgrade.md for what each class means in practice.

rules:
  - {pattern: "Read me first.md", class: system}
  - {pattern: "CLAUDE.md", class: system}

  - {pattern: "Shared/Claude/Instructions.md", class: system}
  - {pattern: "Shared/Claude/Changelog.md", class: system}
  - {pattern: "Shared/Claude/Tests/Test questions.md", class: system}
  - {pattern: "Shared/Claude/Tests/Runs/*", class: generated}
  - {pattern: "Shared/Claude/Company.md", class: context}
  - {pattern: "Shared/Claude/Data.md", class: context}
  - {pattern: "Shared/Claude/Calendar.md", class: context}
  - {pattern: "Shared/Claude/Rules.md", class: client}
  - {pattern: "Shared/Claude/Metric catalogue.md", class: generated}
  - {pattern: "Shared/Claude/Template manifest.json", class: generated}
  - {pattern: "Shared/Claude/Upgrade report *", class: generated}
  - {pattern: "Shared/Workflows/*", class: system}

  - {pattern: "CFO/Role.md", class: system}
  - {pattern: "VP/Role.md", class: system}
  - {pattern: "Team/Role.md", class: system}
  - {pattern: "CFO/Memory/*", class: client}
  - {pattern: "VP/Memory/*", class: client}
  - {pattern: "Team/Memory/*", class: client}

# Empty folders deploy and upgrade create, for the tiers in use only. Git does not keep empty
# folders, and the folder should not carry placeholder files, so they are listed here instead.
directories:
  - "CFO/Periods"
  - "CFO/Projects"
  - "VP/Periods"
  - "VP/Projects"
  - "Team/Periods"
  - "Team/Projects"
